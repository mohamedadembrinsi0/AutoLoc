spring.application.name=autoloc-api

spring.config.import=optional:file:.idea/local-secrets.properties

# Connexion à la base de données
spring.datasource.url=jdbc:mariadb://localhost:3306/autoloc_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:${spring.datasource.local-password:}}

# Hibernate / JPA
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Logs
logging.level.org.hibernate.SQL=OFF
logging.level.tn.esprit.autoloc=INFO
